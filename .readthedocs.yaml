# .readthedocs.yaml
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

  jobs:
    install:
      - pip install "uv==0.13.1"
      - python scripts/dependencies.py sync --mode public --only-group docs --no-install-project --environment "$READTHEDOCS_VIRTUALENV_PATH" --inexact
    pre_build:
      - python schema_to_markdown.py --batch

mkdocs:
  configuration: mkdocs.yml
